<svg width="1200" height="410" viewBox="0 0 1200 410" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg{fill:#F5F5F7}.surface{fill:#FFFFFF;stroke:#E5E5EA}.ink{fill:#1D1D1F}.muted{fill:#6E6E73}.accent{fill:#0071E3}.line{stroke:#D2D2D7}.pill{fill:#F5F5F7;stroke:#E5E5EA}
    @media (prefers-color-scheme: dark){.bg{fill:#0D1117}.surface{fill:#161B22;stroke:#30363D}.ink{fill:#F5F5F7}.muted{fill:#9BA3AE}.accent{fill:#2997FF}.line{stroke:#30363D}.pill{fill:#0D1117;stroke:#30363D}}
  </style>
  <defs>
    <linearGradient id="softBlue" x1="120" y1="60" x2="1080" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0071E3" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#5E5CE6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#34AADC" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0071E3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0071E3"/>
      <stop offset="1" stop-color="#5E5CE6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
    <clipPath id="clip"><rect width="1200" height="410" rx="34"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="410" rx="34" class="bg"/>
    <rect x="1" y="1" width="1198" height="408" rx="33" class="surface"/>

    <ellipse cx="990" cy="55" rx="230" ry="145" fill="url(#softBlue)" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-28 16;0 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="185" cy="388" rx="210" ry="120" fill="url(#softBlue)" opacity="0.55" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;34 -12;0 0" dur="17s" repeatCount="indefinite"/>
    </ellipse>

    <text x="60" y="62" class="ink" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="700">AB.</text>
    <g transform="translate(878 34)">
      <rect width="262" height="44" rx="22" class="pill"/>
      <circle cx="25" cy="22" r="5" fill="#34C759">
        <animate attributeName="opacity" values="1;0.38;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="27" class="muted" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600">Open to engineering roles</text>
    </g>

    <text x="600" y="145" text-anchor="middle" class="muted" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="650" letter-spacing="2.5">SOFTWARE ENGINEER</text>
    <text x="600" y="216" text-anchor="middle" class="ink" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="720" letter-spacing="-2">Abdellah Bouaamoud</text>
    <text x="600" y="266" text-anchor="middle" class="muted" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="450">Reliable backend platforms. Data-driven products. Cloud-ready delivery.</text>

    <rect x="394" y="300" width="412" height="3" rx="1.5" fill="url(#accentLine)">
      <animate attributeName="x" values="394;454;394" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="width" values="412;292;412" dur="9s" repeatCount="indefinite"/>
    </rect>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600">
      <rect x="304" y="330" width="180" height="46" rx="23" class="pill"/>
      <text x="394" y="358" text-anchor="middle" class="ink">Backend systems</text>
      <rect x="510" y="330" width="180" height="46" rx="23" class="pill"/>
      <text x="600" y="358" text-anchor="middle" class="ink">Data &amp; automation</text>
      <rect x="716" y="330" width="180" height="46" rx="23" class="pill"/>
      <text x="806" y="358" text-anchor="middle" class="ink">Cloud delivery</text>
    </g>
  </g>
</svg>
